<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 257" aria-hidden="true" role="img">
  <defs>
    <linearGradient id="guitarBody" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFEA83"/>
      <stop offset="90%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="guitarNeck" x1="40%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#41D1FF"/>
      <stop offset="100%" stop-color="#BD34FE"/>
    </linearGradient>
    <radialGradient id="guitarHole" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a57400"/>
      <stop offset="100%" stop-color="#e5b259"/>
    </radialGradient>
  </defs>
  <!-- Guitar body -->
  <ellipse cx="120" cy="180" rx="65" ry="60" fill="url(#guitarBody)" stroke="#c9871d" stroke-width="5"/>
  <!-- Guitar hole -->
  <ellipse cx="120" cy="180" rx="16" ry="15" fill="url(#guitarHole)" stroke="#714100" stroke-width="3"/>
  <!-- Guitar neck -->
  <rect x="112" y="48" width="16" height="105" rx="5" fill="url(#guitarNeck)" stroke="#8352b3" stroke-width="3"/>
  <!-- Guitar head -->
  <rect x="109" y="30" width="22" height="26" rx="6" fill="#a46afe" stroke="#673ab7" stroke-width="3"/>
  <!-- Tuning pegs -->
  <circle cx="115" cy="33" r="2" fill="#FFE6A1" />
  <circle cx="125" cy="33" r="2" fill="#FFE6A1" />
  <circle cx="120" cy="33" r="2" fill="#FFE6A1" />
  <circle cx="115" cy="52" r="2" fill="#FFE6A1" />
  <circle cx="125" cy="52" r="2" fill="#FFE6A1" />
  <circle cx="120" cy="52" r="2" fill="#FFE6A1" />
  <!-- Guitar strings (simple lines) -->
  <rect x="115" y="56" width="2" height="124" rx="1" fill="#fff8d0" opacity="0.9"/>
  <rect x="119" y="56" width="2" height="124" rx="1" fill="#fff8d0" opacity="0.9"/>
  <rect x="123" y="56" width="2" height="124" rx="1" fill="#fff8d0" opacity="0.9"/>
  <rect x="127" y="56" width="2" height="124" rx="1" fill="#fff8d0" opacity="0.9"/>
</svg>